name: اختبار ونشر على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: فحص المستودع (لا صور شخصية ولا أسرار)
        run: node tools/check-repo.js
      - name: أداة رسم المشاهد الاصطناعية لاختبارات التعرف (sharp)
        run: npm install --no-save --no-package-lock sharp@0.34
      - name: اختبارات الوحدات
        run: npm test
      - name: تجهيز ملفات النشر وختم الإصدار
        run: node tools/build-site.js "${GITHUB_SHA::7}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
